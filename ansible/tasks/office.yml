---
- name: Native bounded CODE service (not PHP spawned)
  ansible.builtin.template:
    src: office.service.j2
    dest: /etc/systemd/system/mail-cloud-office-code.service
    mode: '0644'
- ansible.builtin.systemd:
    daemon_reload: true
    name: mail-cloud-office-code
    enabled: true
    state: started
- name: Wait for private CODE
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: 9983
    timeout: 180
- name: Wait for TLS Office discovery XML before CLI activation (cold start)
  ansible.builtin.uri:
    url: 'https://{{ c.cloud_host }}/hosting/discovery'
    method: GET
    return_content: true
    status_code: 200
    timeout: 5
    validate_certs: true
    use_proxy: false
    follow_redirects: none
  register: office_discovery_ready
  until:
    - (office_discovery_ready.status | default(0)) == 200
    - "'<wopi-discovery' in (office_discovery_ready.content | default(''))"
  retries: 24
  delay: 2
  changed_when: false
  no_log: true
- name: Configure internal/public WOPI gateway with certificate verification
  ansible.builtin.command:
    argv: [/usr/local/lib/mail-cloud/occ, config:app:set, richdocuments, '{{ item.key }}', '--value={{ item.value }}']
  loop:
    - {key: wopi_url, value: 'https://{{ c.cloud_host }}'}
    - {key: public_wopi_url, value: 'https://{{ c.cloud_host }}'}
    - {key: disable_certificate_verification, value: 'no'}
- name: Activate Office discovery
  ansible.builtin.command: /usr/local/lib/mail-cloud/occ richdocuments:activate-config
- name: Refresh web PHP app-config cache after CLI WOPI updates
  ansible.builtin.systemd:
    name: mail-cloud-php
    state: restarted
- name: Wait for refreshed web PHP socket
  ansible.builtin.wait_for:
    path: /run/mail-cloud-php/php.sock
    timeout: 30
- name: Confirm refreshed PHP stays active
  ansible.builtin.command: systemctl is-active mail-cloud-php
  changed_when: false
