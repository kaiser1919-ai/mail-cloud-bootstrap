name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install 'ansible-core>=2.19,<2.20' jinja2 pyyaml
      - run: python -m unittest discover -s tests -v
      - run: bash -n install.sh && sh -n ansible/files/renew.sh
      - run: ansible-playbook -i localhost, -c local ansible/site.yml --syntax-check
      - run: bash tests/render.sh
      - run: python -m compileall -q installer ansible/files
  # Not a deployment test. Acceptance requires a disposable Debian 13 VPS + real DNS.
